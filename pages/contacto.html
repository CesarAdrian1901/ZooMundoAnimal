<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>  

    <header>
        <h1 style="text-align: center; color:brown">Zoologico mundo animal</h1>
        <p style="text-align: center; font-size: 20px;">Bienvenidos a tu lugar favorito</p>
    </header>
    <hr>
    <nav>
        <a href="../index.html">Home</a>
        <a href="https://wiwaquito.org/" target="_blank">Pagina oficial</a>
        <a href="/ZooMundoAnimal/pages/galeria.html">Galeria</a>
        <a href="/ZooMundoAnimal/pages/contacto.html">Contacto</a>
    </nav>
    <hr>
    <!--Formulario de registro-->
    <form action="#">
        <label for="nombre">Ingrese su nombre</label>
        <br>
        <input type="text" id="nombre" placeholder="nombre" size="10" required>
        <br><br>
        <label for="email">Ingrese su email</label>
        <br>
        <input type="email" id="email" placeholder="email" size="10" required>
        <br><br>
        <label for="password">Ingrese su contraseña</label>
        <br>
        <input type="password" id="password" placeholder="contraseña" required>
        <br><br>
        <label for="fecha_nacimiento">Ingrese su fecha de fecha de nacimiento</label>
        <br>
        <input type="date" id="fecha_nacimiento" placeholder="fecha de cumpleaños" required>
        <br><br>
        <label for="cargas_familiares">Cargas familiares</label>
        <br>
        <input type="number" id="cargas_familiares" placeholder="cargas familiares" required>
        <br><br>
        <label for="#">Género</label>
        <br>
        <label for="masculino">
        <input type="radio" id="masculino" name="genero">Masculino</label>
        <label for="femenino">
        <input type="radio" id="femenino" name="genero">Femenino</label>
        <label for="otro">
        <input type="radio" id="otro" name="genero">Otro</label>
        <br><br>
        <label for="ciudad">Seleccione su ciudad</label>
        <select name="ciudad" id="ciudad">
            <option value="opcion" disabled selected>Seleccionar opcion</option>
            <option value="quito">Quito</option>
            <option value="ambato">Ambato</option>
            <option value="guayaquil">Guayaquil</option>
            <option value="loja">Loja</option>
            <option value="ibarra">Ibarra</option>
            <option value="cuenca">Cuenca</option>
            <option value="otro">Otro</option>
        </select>
        <br><br>
        <label for="foto">Seleccione su foto</label>
        <br>
        <input type="file" id="foto">
        <br><br>
        <label for="comentarios">Deje sus comentarios</label>
        <br>
        <textarea name="comentarios" id="comentarios" cols="50" rows="10" placeholder="Escriba sus comentarios"></textarea>
        <!--Botones
            button = simple
            submit = boton que envia datos
            reset = limpia el formulario
        -->
        <br><br>
        <button>Boton simple</button>
        <br>
        <input type="submit" value="Enviar">
        <br>
        <button type="reset">Limpiar</button>

    </form>
    
    
</body>
</html>
